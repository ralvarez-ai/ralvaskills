      content="rsk installs versioned skills into Claude Code and OpenCode. Its MCP server lets the agent propose them from your project's files; the one tool that writes asks you first."
    />
    <meta property="og:url" content="https://rsk.ralvarez.dev/" />

    <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1514" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Resolve the theme, motion and JS flags before first paint, so a stored
         preference does not flash the wrong palette and the reveal rules only
         hide content when motion is allowed and JS is running. -->
    <script>
      (function () {
        var d = document.documentElement,
          s = null;
        try {
          s = localStorage.getItem('rsk-theme');
        } catch (e) {}
        d.setAttribute('data-theme', s || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('has-motion');
        d.classList.add('is-js');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
