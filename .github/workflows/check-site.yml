name: Check site

# The landing page in site/. It reads the registry, skills/**, the Go sources and
# the git tags to generate its data (site/scripts/gen-data.mjs), so changes to any
# of those can break it as well.
# Manual-dispatch only, deliberately: push/PR/tag triggers are off so nothing
# runs on a billed GitHub-hosted runner. The same workflow runs locally instead
# (`task ci:local`), and workflow_dispatch stays so it can still be run by hand
# from the Actions tab when needed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4
        with:
          # gen-data.mjs reads the latest tag for the version shown on the page.
          fetch-depth: 0
          fetch-tags: true

      # pnpm's version comes from "packageManager" in site/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: "@ralvarez-ts"

      # @ralvarez-ts/tokens is on GitHub Packages: the secret needs packages:read.
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      # Biome: format, imports and the recommended lint rules (a11y included).
      - name: Lint
        run: pnpm lint

      # Typecheck, vite build, prerender. gen-data fails the build if the tree
      # drifts from 58 skills / 15 bundles / 13 commands / 3 tools.
      - name: Build
        run: pnpm build
        env:
          VITE_REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}

      # verify.mjs drives a Chrome. Hosted runners ship one; the act image does
      # not, so fall back to Playwright's Chromium (verify.mjs finds it in
      # ~/.cache/ms-playwright).
      - name: Browser
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            pnpm exec playwright-core install --with-deps chromium
          fi

      - name: Gate (axe, overflow, films, rail, style wiring, JS off)
        run: node scripts/verify.mjs

  # The Go gates the item `k9c2xm` found were only run by hand. Same
  # manual-dispatch policy as above: no push trigger, so nothing runs on a
  # billed runner unless someone starts it or `task ci:local` does.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false

      - uses: ./.github/actions/private-go-modules
        with:
          token: ${{ secrets.GH_PRIVATE_MODULES_TOKEN }}

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: task lint

      - name: Registry check
        run: task registry:check

      - name: Token tool lint
        run: task tokens:lint
