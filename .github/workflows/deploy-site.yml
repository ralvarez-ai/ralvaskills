name: Deploy site

# The landing page in site/ as the Cloudflare Worker `ralvaskills` (static assets, see
# site/wrangler.jsonc; https://rsk.ralvarez.dev/). Manual-dispatch only, like check-site.yml: nothing
# runs on a billed runner unless started by hand. It does not touch the registry
# workflow, and the registry workflow does not touch it.
# Secrets: CLOUDFLARE_API_TOKEN (Account > Workers Scripts > Edit, plus the
# ralvarez.dev zone for the custom domain), CLOUDFLARE_ACCOUNT_ID, NODE_AUTH_TOKEN (packages:read).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: "@ralvarez-ts"

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Browser
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            pnpm exec playwright-core install --with-deps chromium
          fi

      - name: Gate
        run: node scripts/verify.mjs

      - name: Deploy
        run: pnpm dlx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
