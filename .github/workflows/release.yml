name: Release CLI

# Manual-dispatch only, deliberately: push/PR/tag triggers are off so nothing
# runs on a billed GitHub-hosted runner. The same workflow runs locally instead
# (`task ci:local`), and workflow_dispatch stays so it can still be run by hand
# from the Actions tab when needed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs full history to build the changelog
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false

      - uses: ./.github/actions/private-go-modules
        with:
          token: ${{ secrets.GH_PRIVATE_MODULES_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin goreleaser to the exact triggering tag so it can't grab a
          # skill tag (e.g. `name@vX.Y.Z`) via `git describe` fallback.
          GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}
